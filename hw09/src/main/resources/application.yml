server:
  port: 8080

spring:
  application:
    name: demo-otus-memory-dump
  sql:
    init:
      mode: never

  h2:
    console:
      path: /h2-console
      settings:
        web-allow-others: true
      enabled: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    generate-ddl: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100

  flyway:
    enabled: true
    locations: classpath:/db/migration

logging:
  level:
    root: info