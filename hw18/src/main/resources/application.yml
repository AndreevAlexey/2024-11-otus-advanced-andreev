server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: otus-resilience
  sql:
    init:
      mode: never

  h2:
    console:
      path: /h2-console
      settings:
        web-allow-others: true
      enabled: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    generate-ddl: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100

  flyway:
    enabled: true
    locations: classpath:/db/migration

logging:
  level:
    root: info


resilience4j.ratelimiter:
  instances:
    rps_20:
      limitForPeriod: 20
      limitRefreshPeriod: 1s
      timeoutDuration: 0s
    rpm_30:
      limitForPeriod: 30
      limitRefreshPeriod: 1m
      timeoutDuration: 0s

resilience4j.circuitbreaker:
  instances:
    rate_50_10s:
      sliding-window-type: TIME_BASED
      minimumNumberOfCalls: 5

      failure-rate-threshold: 50
      sliding-window-size: 10

      slowCallRateThreshold: 50
      slowCallDurationThreshold: 200ms

      wait-duration-in-open-state: 5s
      permitted-number-of-calls-in-half-open-state: 1
