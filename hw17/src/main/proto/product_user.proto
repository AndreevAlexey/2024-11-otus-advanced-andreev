syntax = "proto3";

package shop;

service ProductUser {
  rpc createUser(NewUser) returns (UserID);

  rpc changeUserEmail(UpdateUserMail) returns (Empty);

  rpc changeUserName(UpdateUserName) returns (Empty);

  rpc createProduct(ProductName) returns (ProductID);

  rpc addProductToCart(UserProduct) returns(Empty);
}

message Product {
  int32 id = 1;
  string name = 2;
}

message User {
  int32 id = 1;
  string username = 2;
  string email = 3;
}

message Empty {
}

message NewUser {
  string email = 1;
  string username = 2;
}

message UserID {
  int32 value = 1;
}

message UpdateUserMail {
  int32 id = 1;
  string email = 2;
}

message UpdateUserName {
  int32 id = 1;
  string name = 2;
}

message ProductID {
  int32 value = 1;
}

message ProductName {
  string value = 1;
}

message UserProduct {
  int32 user_id = 1;
  int32 product_id = 2;
}


