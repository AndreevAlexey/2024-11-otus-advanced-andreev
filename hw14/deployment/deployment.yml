kind: Service
apiVersion: v1
metadata:
  name: otus-helm-backend
spec:
  selector:
    app: otus-helm-backend
    tier: backend
  ports:
    - protocol: TCP
      port: 8080
      nodePort: 30001
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otus-helm-backend
spec:
  selector:
    matchLabels:
      app: otus-helm-backend
      tier: backend
  replicas: 1
  template:
    metadata:
      labels:
        app: otus-helm-backend
        tier: backend
    spec:
      containers:
        - name: otus-helm-backend
          image: 127.0.0.1:5000/otus-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080