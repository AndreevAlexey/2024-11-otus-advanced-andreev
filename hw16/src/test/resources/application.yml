server:
  port: 8080

spring:

  datasource:
    url: jdbc:h2:mem:testdb

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    generate-ddl: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100

  flyway:
    enabled: true
    locations: ['classpath:db/migration', 'classpath:test/resources/db/migration']