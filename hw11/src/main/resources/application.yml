server:
  port: 8080

spring:
  application:
    name: otus-reactor

  sql:
    init:
      mode: never

#  h2:
#    console:
#      path: /h2-console
#      settings:
#        web-allow-others: true
#      enabled: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    generate-ddl: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100

  flyway:
    enabled: true
    locations: classpath:/db/migration
    url: jdbc:h2:mem:~/db/testdb;DB_CLOSE_DELAY=-1

  r2dbc:
    url: r2dbc:h2:mem:///~/db/testdb

logging:
  level:
    root: info